# TEST_INVENTORY.yaml — P1 Naming Authority (1:1 enumeration with TRACEABILITY_MATRIX.md §2)
# Maps every AC in SRS.md §3/§4 to an independent tc_id; derive_test_cases.md (P2) preserves
# these names in TEST_SPEC.md. Convention: TC-FR##-AC# for FR-##, TC-NFR##-AC# for NFR-##.
# Layer assignment follows TRACEABILITY_MATRIX.md §4 Code→Test buckets.
# 1:1 contract: every tc_id enumerated below = one contract item with its own asserts.
# Range syntax in any forward-trace documentation is shorthand; this file enumerates each AC
# independently (no collapsing, no omission — cross-cutting coverage is signalled via
# cross_ref_frs / cross_ref_nfrs metadata, not by deletion).

test_inventory:
  metadata:
    format_version: "2.0"
    description: >-
      P1 naming authority enumerating one tc_id per AC across all FR-01..FR-10 and
      NFR-01..NFR-12. 1:1 mapping with TRACEABILITY_MATRIX.md §2 (FR↔SRS) forward trace.
    traceability_source: "01-requirements/TRACEABILITY_MATRIX.md §2"
    srs_source: "01-requirements/SRS.md §3 (FR) / §4 (NFR)"
    spec_verification_source: "SPEC.md §8 / §10"
    naming_convention: "TC-{FR##|NFR##}-AC#"
    layers:
      - unit
      - integration
      - cross_cutting
  tests:
    # ============================================================
    # FR-01 — Task Resource CRUD API (7 ACs)
    # ============================================================
    - tc_id: TC-FR01-AC1
      fr: FR-01
      ac_ref: "AC-1.1"
      layer: integration
      test_function: test_create_task_returns_201
      spec_rows: ["#4"]
      assertion_summary: "POST /v1/tasks with valid write key + non-empty name/command (≤1000 chars) + no blacklist hits + non-duplicate name returns 201 + task id."
    - tc_id: TC-FR01-AC2
      fr: FR-01
      ac_ref: "AC-1.2"
      layer: integration
      test_function: test_create_task_invalid_body_returns_422
      spec_rows: ["#4"]
      assertion_summary: "POST /v1/tasks with body failing TaskCreate pydantic model returns 422 + application/problem+json."
    - tc_id: TC-FR01-AC3
      fr: FR-01
      ac_ref: "AC-1.3"
      layer: integration
      test_function: test_get_unknown_task_returns_404
      spec_rows: ["#7"]
      assertion_summary: "GET /v1/tasks/{unknown} returns 404 + application/problem+json."
    - tc_id: TC-FR01-AC4
      fr: FR-01
      ac_ref: "AC-1.4"
      layer: integration
      test_function: test_duplicate_name_returns_409
      spec_rows: ["#8"]
      assertion_summary: "POST /v1/tasks with duplicate name returns 409 + application/problem+json."
    - tc_id: TC-FR01-AC5
      fr: FR-01
      ac_ref: "AC-1.5"
      layer: unit
      test_function: test_cursor_pagination_unit
      spec_rows: []
      assertion_summary: "Pagination is cursor-based; offset/limit-based paging is not used (unit test of cursor decode/encode helper)."
    - tc_id: TC-FR01-AC6
      fr: FR-01
      ac_ref: "AC-1.6"
      layer: integration
      test_function: test_list_limit_exceeds_max_returns_422
      spec_rows: ["#4"]
      assertion_summary: "Default limit=50, max=200; limit>200 returns 422."
    - tc_id: TC-FR01-AC7
      fr: FR-01
      ac_ref: "AC-1.7"
      layer: integration
      test_function: test_list_sql_count_constant
      spec_rows: ["#14"]
      cross_ref_nfrs: ["NFR-01", "NFR-06"]
      assertion_summary: "List endpoint SQL statement count is constant w.r.t. rows returned (N+1 guard)."

