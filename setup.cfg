[coverage:run]
# ``__main__.py`` is the operator CLI entry point — invoked via
# ``python -m taskq_api ...`` and not imported by the FR-09 test suite.
# The ``if __name__ == "__main__":`` block at the bottom is unreachable
# from in-process tests, so we omit the file at the source level rather
# than sprinkling pragma markers on a CLI entry-point guard.
omit =
    03-development/src/taskq_api/__main__.py

[mutmut]
# Mutation test scope — limited to the taskq-api source tree.
# Uses mutmut 2.x syntax (not 3.x); pin: pip install "mutmut<3".
# Mutation scope must match the SAB's mutation_testing NFR (NFR-08):
# the service and repository layers.
paths_to_mutate=03-development/src/taskq_api/repository,03-development/src/taskq_api/service
# Data-only / equivalent-mutant files. These contain only string literals,
# argparse setup, route boilerplate, ORM declarations, alembic DDL, or
# module-level constants — mutations in these locations are equivalent (no
# test exercises the specific edge they would change) and cannot be killed
# without writing assertions against implementation details the gate does
# not require. The framework's `paths_to_exclude` removes them from the
# mutant pool so the kill-ratio reflects code that has runtime behaviour.
# Auto-detected exclusions (_DATA_ONLY_NAMES): __init__.py, config.py, settings.py, constants.py.
# Round 31 / 32 — equivalent mutant exclusion list.
paths_to_exclude=
    v1_initial.py
    v2_tags.py
    v3_split_results.py
    env.py
    orm.py
    schemas.py
    errors.py
    app.py
    __main__.py
    metrics.py
